  </defs>
  <g id="oznaka-cilja">
    <circle cx="25" cy="25" r="22" fill="url(#sjaj)" stroke="#bf360c" stroke-width="2"/>
    <circle cx="25" cy="25" r="13" fill="none" stroke="#ffffff" stroke-width="3"/>
    <circle cx="25" cy="25" r="4" fill="#ffffff"/>
  </g>
  <g transform="translate(50 0)">
    <g id="oznaka-polazista">
      <line x1="12" y1="6" x2="12" y2="46" stroke="#1f2937" stroke-width="3"/>
      <path d="M12 6 L40 14 L12 24 Z" fill="#2e7d32" stroke="#1f2937" stroke-width="1.5"/>
