<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" width="100" height="50" data-synthetic="true">
  <title>List oznaka (sintetički)</title>
  <desc>SINTETIČKI LIST s više simbola u jednoj datoteci; svaki simbol izdvaja se prema id-u grupe.</desc>
  <defs>
    <radialGradient id="sjaj" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc80"/>
